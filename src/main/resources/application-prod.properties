# ============================================
# APPLICATION IDENTITY
# ============================================
spring.application.name=news-service
server.port=8034

# ============================================
# DEVELOPMENT FEATURES - DISABLED IN PROD
# ============================================
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# ============================================
# SERVER CONFIGURATION
# ============================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.http2.enabled=true

# ============================================
# DATABASE CONFIGURATION - PostgresSQL
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool - HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=NewsServiceHikariPool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================
# JPA AND HIBERNATE CONFIGURATION
# ============================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================
# REDIS CACHE CONFIGURATION
# ============================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=${spring.application.name}:

# ============================================
# JACKSON JSON CONFIGURATION
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# ============================================
# EUREKA CLIENT CONFIGURATION
# ============================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://conecta-eureka-peer1:8761/eureka/,http://conecta-eureka-peer2:8762/eureka/}

# Instance Configuration
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${HOSTNAME:localhost}
eureka.instance.non-secure-port-enabled=true
eureka.instance.secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.status-page-url=https://${eureka.instance.hostname}:${server.port}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}:${server.port}/actuator/health

# Lease Configuration (Production optimized)
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Client Fetch Registry Configuration
eureka.client.registry-fetch-interval-seconds=10
eureka.client.initial-instance-info-replication-interval-seconds=20
eureka.client.instance-info-replication-interval-seconds=10

# Enable healthcheck
eureka.client.healthcheck.enabled=true

# ============================================
# OAUTH2 RESOURCE SERVER - KEYCLOAK
# ============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256

# JWT Cache Configuration
spring.security.oauth2.resourceserver.jwt.cache-enabled=true

# ============================================
# RESILIENCE4J - CIRCUIT BREAKER
# ============================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=100
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=100
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-type=count_based

# Retry Configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.retry-exceptions=org.springframework.web.client.HttpServerErrorException,java.io.IOException

# Bulkhead Configuration
resilience4j.bulkhead.configs.default.max-concurrent-calls=25
resilience4j.bulkhead.configs.default.max-wait-duration=100ms

# Time Limiter
resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# ============================================
# ACTUATOR & HEALTH CHECKS
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env
management.endpoints.web.exposure.exclude=
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,diskSpace
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.eureka.enabled=true
management.health.circuitbreakers.enabled=true
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true

# Metrics Configuration
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}
management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.process=true
management.metrics.enable.http=true

# Info Endpoint
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION}
info.app.description=News microservice for insurance platform
info.app.encoding=${project.build.sourceEncoding:UTF-8}
info.java.version=${java.version}

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.conectaseguros.co=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.data.redis=INFO

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg %X{traceId:-} %X{spanId:-}%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg %X{traceId:-} %X{spanId:-}%n

# ============================================
# HTTP CLIENT TIMEOUTS
# ============================================
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000
spring.cloud.openfeign.client.config.default.logger-level=basic
spring.cloud.openfeign.httpclient.enabled=true
spring.cloud.openfeign.httpclient.max-connections=200
spring.cloud.openfeign.httpclient.max-connections-per-route=50
spring.cloud.openfeign.httpclient.time-to-live=900
spring.cloud.openfeign.httpclient.time-to-live-unit=seconds
spring.cloud.openfeign.httpclient.follow-redirects=true
spring.cloud.openfeign.httpclient.connection-timeout=5000
spring.cloud.openfeign.httpclient.connection-timer-repeat=3000
spring.cloud.openfeign.compression.request.enabled=true
spring.cloud.openfeign.compression.response.enabled=true

# RestTemplate Timeouts
spring.mvc.async.request-timeout=30000

# ============================================
# SECURITY HEADERS
# ============================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================
# INTERNATIONALIZATION
# ============================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# ============================================
# DATA SOURCE PROPERTIES (Additional)
# ============================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ============================================
# CUSTOM APPLICATION PROPERTIES
# ============================================
app.jwt.expiration=${JWT_EXPIRATION}
app.api.rate-limit.enabled=${RATE_LIMIT_ENABLED}
app.api.rate-limit.requests-per-second=${RATE_LIMIT_RPS}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://tudominio.com}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.exposed-headers=Authorization,X-Total-Count
app.cors.allow-credentials=true
app.cors.max-age=3600

# Apache POI configuration
file.upload.temp-directory=${java.io.tmpdir}/uploads
file.upload.allowed-extensions=xlsx,xls,csv
file.upload.max-size-bytes=52428800

# File processing configuration
app.procesamiento.lote-tamaño=1000
app.procesamiento.max-hilos=5
app.procesamiento.timeout-segundos=30

app.services.api-gateway.base-url=http://localhost:8080
app.services.clientes.timeout=5000
app.services.products-service.name=products-service
app.services.productos.timeout=5000

# Asynchronous processing
processing.async.core-pool-size=5
processing.async.max-pool-size=10
processing.async.queue-capacity=100
processing.async.thread-name-prefix=file-processor-

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100

app.services.clients-service.name=clients-service
app.services.use-direct-service=true
app.services.use-eureka=true

# Multipart configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ============================================
# ENVIRONMENT INFO
# ============================================
deployment.environment=${DEPLOYMENT_ENV:}
deployment.region=${DEPLOYMENT_REGION}
deployment.zone=${ZONE}