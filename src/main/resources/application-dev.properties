spring.application.name=news-service

server.port=0

spring.devtools.livereload.enabled=false

# Multipart configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5437/news_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# Cache configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JPA and Hibernate configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.type.preferred_uuid_jdbc_type=CHAR

# Eureka client
eureka.client.service-url.defaultZone=http://aureka:password@localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
eureka.client.registry-fetch-interval-seconds=5

# Apache POI configuration
file.upload.temp-directory=${java.io.tmpdir}/uploads
file.upload.allowed-extensions=xlsx,xls,csv
file.upload.max-size-bytes=52428800

# File processing configuration
app.procesamiento.lote-tamaño=1000
app.procesamiento.max-hilos=5
app.procesamiento.timeout-segundos=30

app.services.api-gateway.base-url=http://localhost:8080
app.services.clientes.timeout=5000
app.services.products-service.name=products-service
app.services.productos.timeout=5000

# Asynchronous processing
processing.async.core-pool-size=5
processing.async.max-pool-size=10
processing.async.queue-capacity=100
processing.async.thread-name-prefix=file-processor-

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100

# Logging configuration
logging.level.conectaseguros.co=DEBUG
logging.level.org.springframework.web.multipart=DEBUG

# Keycloak configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8181/realms/conecta-seguros/protocol/openid-connect/certs

app.services.clients-service.name=clients-service
app.services.use-direct-service=true
app.services.use-eureka=true